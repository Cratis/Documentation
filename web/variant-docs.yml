version: 2

# Product-neutral, two-axis variant documentation.
#
# A product can document more than one interchangeable implementation of the
# same concept along one or more independent *axes* (for example a backend
# client language axis and a frontend framework axis). Each axis owns:
#   - a sync-time macro expanded into Starlight <Tabs> from variant-owned snippets,
#   - a mount point for the variant's own public docs,
#   - a sidebar group,
#   - the ratchets that keep the shared docs variant-neutral.
#
# Chronicle is currently the only configured product; its single `client` axis
# is the multi-language client SDK documentation model.

products:
  chronicle:
    sharedDocs:
      paths:
        - ../../Chronicle/Documentation
        - ../Chronicle/Documentation

    axes:
      client:
        macro: ChronicleClientTabs
        # Starlight syncs tab selection by label across a single flat
        # localStorage namespace, so every axis needs its own syncKey. Two axes
        # sharing one key would make selecting a backend language silently
        # switch an unrelated frontend framework tab set.
        syncKey: chronicle-client
        mount:
          route: clients
          landing:
            title: Client SDKs
            intro: >-
              Chronicle concepts, guides, and feature workflows live in the shared
              Chronicle docs and use language tabs when the client APIs differ. Use
              the client SDK sections for installation, connection setup, runtime
              integration, language idioms, and API reference details.
            sharedHeading: Shared Chronicle topics
            variantHeading: Client SDK details
        sidebar:
          groupLabel: Client SDKs
          # `after-bucket` injects the group after the named bucket once the
          # Diataxis buckets exist, so the group is a permanent peer of the
          # buckets. (`into-bucket` with `targetBucket` instead injects before
          # bucketing so the group is absorbed *inside* that bucket.)
          injectMode: after-bucket
          anchorBucket: Start here

        # Fence languages that count as client-SDK debt in the shared docs.
        # Aliases are folded into the canonical name so ```cs and ```ts are
        # counted as csharp/typescript rather than escaping the ratchet.
        ratchetLanguages:
          - name: csharp
            aliases: [cs]
          - name: java
          - name: kotlin
          - name: elixir
          - name: typescript
            aliases: [ts, tsx]

        sharedTopics:
          - label: Get started
            href: /chronicle/get-started/
          - label: Events and event logs
            href: /chronicle/events/
          - label: Event appending
            href: /chronicle/events/appending/
          - label: Read models
            href: /chronicle/read-models/
          - label: Projections
            href: /chronicle/projections/
          - label: Reactors
            href: /chronicle/reactors/
          - label: Reducers
            href: /chronicle/reducers/
          - label: Constraints
            href: /chronicle/constraints/
          - label: Event seeding
            href: /chronicle/event-seeding/
          - label: Compliance
            href: /chronicle/compliance/
          - label: Transactions and unit of work
            href: /chronicle/events/transactions/
          - label: Event evolution
            href: /chronicle/understanding-event-evolution/

        variants:
          csharp:
            label: C#
            snippets:
              paths:
                - ../../Chronicle/Documentation/client-snippets
                - ../Chronicle/Documentation/client-snippets
              legacyBaseline: 0
            publicDocs:
              key: dotnet
              label: .NET client
              paths:
                - ../../Chronicle/Documentation/clients/dotnet
                - ../Chronicle/Documentation/clients/dotnet
            validator:
              cwd:
                - ../../Chronicle
                - ../Chronicle
              command: python3
              args:
                - Documentation/validate-client-snippets.py

          kotlin:
            label: Kotlin
            snippets:
              paths:
                - ../../Chronicle.Kotlin/Documentation/client-snippets
                - ../Chronicle.Kotlin/Documentation/client-snippets
              legacyBaseline: 0
            publicDocs:
              key: kotlin
              label: Kotlin client
              paths:
                - ../../Chronicle.Kotlin/Documentation
                - ../Chronicle.Kotlin/Documentation
            validator:
              cwd:
                - ../../Chronicle.Kotlin
                - ../Chronicle.Kotlin
              command: python3
              args:
                - Documentation/validate-client-snippets.py
              blockedOutput:
                - Unable to locate a Java Runtime

          java:
            label: Java
            snippets:
              paths:
                - ../../Chronicle.Kotlin/Documentation/client-snippets-java
                - ../Chronicle.Kotlin/Documentation/client-snippets-java
              legacyBaseline: 0
            validator:
              cwd:
                - ../../Chronicle.Kotlin
                - ../Chronicle.Kotlin
              command: python3
              args:
                - Documentation/validate-client-snippets.py
              blockedOutput:
                - Unable to locate a Java Runtime

          elixir:
            label: Elixir
            snippets:
              paths:
                - ../../Chronicle.Elixir/Documentation/client-snippets
                - ../Chronicle.Elixir/Documentation/client-snippets
              legacyBaseline: 0
            publicDocs:
              key: elixir
              label: Elixir client
              paths:
                - ../../Chronicle.Elixir/Documentation
                - ../Chronicle.Elixir/Documentation
            validator:
              cwd:
                - ../../Chronicle.Elixir
                - ../Chronicle.Elixir
              command: python3
              args:
                - Documentation/validate-client-snippets.py
              blockedOutput:
                - "No such file or directory: 'mix'"

          typescript:
            label: TypeScript
            snippets:
              paths:
                - ../../Chronicle.TypeScript/Documentation/client-snippets
                - ../Chronicle.TypeScript/Documentation/client-snippets
              legacyBaseline: 0
            publicDocs:
              key: typescript
              label: TypeScript client
              paths:
                - ../../Chronicle.TypeScript/Documentation
                - ../Chronicle.TypeScript/Documentation
            validator:
              cwd:
                - ../../Chronicle.TypeScript
                - ../Chronicle.TypeScript
              command: python3
              args:
                - Documentation/validate-client-snippets.py

    publicDocsAudit:
      sharedTopicPatterns:
        - concepts/**
        - guides/**
        - events.md
        - event-types.md
        - event-type-migrations.md
        - event-log.md
        - event-sequences.md
        - reactors.md
        - reducers.md
        - read-models.md
        - constraints.md
        - transactions.md
        - migrations.md
        - concurrency.md
        - compliance/**
      # Note: `seeding.md`/`seeding/**` is intentionally NOT in sharedTopicPatterns above.
      # Unlike the other topics here, event-seeding has no shared multi-client <ChronicleClientTabs>
      # coverage in Chronicle/Documentation/event-seeding/** (it's C#-only there), so each client's
      # own seeding.md carries real, non-duplicated API reference rather than a pure bridge.
      baselines:
        csharp: 0
        # Kotlin's guides/** carries reviewed exceptions within the otherwise-pure-bridge
        # folder. Each covers a topic with no shared multi-client <ChronicleClientTabs>
        # coverage yet in Chronicle/Documentation/**, so it carries real, non-duplicated
        # API reference rather than a pure bridge:
        #   - seeding.md: event seeding is C#-only there.
        #   - external-services.md: no shared snippet wiring for any client, including C#,
        #     which links out to its own clients/dotnet page instead.
        #   - read-model-reactors.md: IReadModelReactor has no shared page or snippet
        #     coverage at all yet.
        #   - artifact-registration.md: classpath-scanning artifact discovery
        #     (ChronicleOptions, IArtifactActivator, IReactorMiddleware) is Kotlin/Java
        #     client-SDK mechanics with no shared or other per-client equivalent page.
        #   - captures.md: documents the Kotlin ICapture/store.captures API surface — the
        #     same role .NET's clients/dotnet/captures/declarative and model-bound pages
        #     play for C#; the shared captures page only covers CDL.
        #   - concepts.md: documents declaring ConceptAs<T> in Kotlin/Java (data class vs
        #     value class, Java interop) — client-SDK API, not the shared Chronicle
        #     concepts/glossary.
        #   - testing.md: documents io.cratis:chronicle-testing (EventScenario,
        #     ReadModelScenario) — Kotlin's own new in-process test library, which the
        #     shared testing docs do not yet mention.
        #   - tracing.md: documents the Kotlin client's OpenTelemetry span/attribute
        #     names — no shared "tracing" topic exists yet.
        #   - spring-boot.md: documents the Kotlin/Java Spring Boot starter, request
        #     filters, artifact discovery, tenancy, and blocking facade — client SDK
        #     mechanics with no shared or non-JVM equivalent page.
        #   - migrate-append-routing.md: a Kotlin/Java-client-only breaking-change
        #     migration guide for the next major client's routing defaults — no
        #     shared or other per-client equivalent page exists for this migration.
        kotlin: 10
        elixir: 0
        typescript: 0

  arc:
    sharedDocs:
      paths:
        - ../../Arc/Documentation
        - ../Arc/Documentation

    axes:
      backend:
        macro: ArcBackendTabs
        # Distinct from any frontend-framework axis added later: Starlight syncs
        # tabs by label in one flat namespace, so a shared key would make picking
        # a backend language silently switch an unrelated framework tab set.
        syncKey: arc-backend-language
        mount:
          route: backend
          landing:
            title: Backend
            intro: >-
              Arc's backend concepts, guides, and workflows are the same whichever
              language you write them in, and the shared pages use language tabs
              where the APIs differ. Use a language section for its host, build
              setup, persistence integrations, and API reference details.
            sharedHeading: Shared Arc topics
            variantHeading: Backend languages
        sidebar:
          # Unlike Chronicle's client SDKs, the backend languages belong beside
          # each other *inside* the Backend bucket rather than as a peer of it,
          # so this injects before bucketing and lets bucketing absorb the group.
          groupLabel: Kotlin and Java
          injectMode: into-bucket
          targetBucket: Backend

        ratchetLanguages:
          - name: csharp
            aliases: [cs]
          - name: kotlin
          - name: java

        # Every backend here is expected to answer every shared snippet, so a
        # missing one is an oversight worth hearing about rather than a language
        # that quietly has no tab.
        warnOnMissingSnippet: true

        variants:
          # C# needs no mount: its pages live in Arc/Documentation/backend/csharp
          # and the ordinary shared walk already emits them at that route.
          csharp:
            label: C#
            snippets:
              paths:
                - ../../Arc/Documentation/client-snippets
                - ../Arc/Documentation/client-snippets
            validator:
              cwd:
                - ../../Arc
                - ../Arc
              command: python3
              args:
                - Documentation/validate-client-snippets.py
              blockedOutput:
                - "command not found: dotnet"
                - "No .NET SDKs were found"
          kotlin:
            label: Kotlin
            snippets:
              paths:
                - ../../Arc.Kotlin/Documentation/client-snippets
                - ../Arc.Kotlin/Documentation/client-snippets
            publicDocs:
              key: kotlin
              label: Kotlin and Java
              paths:
                - ../../Arc.Kotlin/Documentation
                - ../Arc.Kotlin/Documentation
            validator:
              cwd:
                - ../../Arc.Kotlin
                - ../Arc.Kotlin
              command: python3
              args:
                - Documentation/validate-doc-snippets.py
