          filter: blob:none
          path: Components

      - name: Checkout AuthProxy
        uses: actions/checkout@v4
        with:
          repository: Cratis/AuthProxy
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: AuthProxy

      - name: Checkout Fundamentals
        uses: actions/checkout@v4
        with:
          repository: Cratis/Fundamentals
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Fundamentals

      # Fundamentals.Go, Chronicle.Go and Arc.Go publish from main
      # only (no docs-overhaul branch); read-only checkouts.
      - name: Checkout Fundamentals.Go
        uses: actions/checkout@v4
        with:
          repository: Cratis/Fundamentals.Go
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Fundamentals.Go

      - name: Checkout Chronicle.Go
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle.Go
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Chronicle.Go

      - name: Checkout Arc.Go
        uses: actions/checkout@v4
        with:
          repository: Cratis/Arc.Go
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
