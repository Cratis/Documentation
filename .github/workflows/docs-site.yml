# Builds and deploys the Astro Starlight documentation site (Documentation/web).
#
# Content lives in each product repo's `Documentation/` folder. Chronicle client
# docs and snippets live in each client repo's `Documentation/` folder. This
# workflow checks each source repo out as a sibling of this repo, matching the
# local dev layout the converter expects (scripts/sync-content.mjs).
# It uses `docs-overhaul` for docs-overhaul validation and `main` for production
# builds and product-repo dispatches.
#
# The build runs on both `docs-overhaul` (validation) and `main`; product repos
# dispatch `build-docs` after docs changes on their `main` branches. The deploy job
# runs ONLY on `main`, so a docs-overhaul push validates the build without publishing.
#
# The slow checks (variant docs, internal links) run on pull requests, the nightly
# schedule and manual runs. Dispatched and push builds (main and docs-overhaul) only
# build, and publish from main. The
# nightly run never deploys; a failing check fails it, and that failure is the report.
#
# A `build-docs` dispatch may carry `client_payload: { repo: "<Name>", sha: "<40-hex>" }`
# naming the source repository whose change triggered it. That repository's .NET API
# assemblies are always recompiled. Every other API repository's Release assemblies are
# restored from a cache keyed on that repository and its checked-out commit, and compiled
# only on a miss. Dispatches without a payload still use and fill the same caches.
#
# PREREQUISITES (one-time, manual):
#   1. Enable GitHub Pages for this repo with "GitHub Actions" as the source.
#   2. The checked-out product repos are public. If any become private, add a repo/org
#      secret `DOCS_CHECKOUT_TOKEN`; the checkout steps fall back to `github.token`.
#   3. If serving under a sub-path (e.g. cratis.io/docs), set `base: '/docs'` in astro.config.mjs.

name: Documentation site

on:
  pull_request:
    branches: [main]
  push:
    branches: [docs-overhaul, main]
  workflow_dispatch:
  repository_dispatch:
    types: [build-docs]
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

# Superseded pull-request builds are cancelled. A running main build is never cancelled:
# product releases dispatch rebuilds faster than a build finishes, so cancelling would
# starve the deploy. GitHub keeps only the newest pending run, so the latest content
# still deploys next. The nightly check run never deploys and has its own group, so a
# dispatch arriving while it waits cannot replace it.
concurrency:
  group: docs-site-${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Product repos are checked out at docs-overhaul only for docs-overhaul validation.
# Main pushes, manual runs from main, and repository_dispatch runs use main.
env:
  DOCS_REF: ${{ github.ref_name == 'docs-overhaul' && 'docs-overhaul' || 'main' }}
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Documentation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: Documentation
          # Full history so Starlight can show per-page "Last updated" dates.
          fetch-depth: 0
          filter: blob:none

      - name: Checkout Samples
        uses: actions/checkout@v4
        with:
          repository: Cratis/Samples
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Samples

      - name: Checkout Chronicle
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Chronicle

      - name: Checkout Chronicle.Kotlin client docs
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle.Kotlin
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Chronicle.Kotlin

      - name: Checkout Chronicle.Elixir client docs
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle.Elixir
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Chronicle.Elixir

      - name: Checkout Chronicle.TypeScript client docs
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle.TypeScript
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
