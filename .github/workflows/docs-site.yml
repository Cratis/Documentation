          filter: blob:none
          path: cli

      - name: Checkout Templates
        uses: actions/checkout@v4
        with:
          repository: Cratis/Templates
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Templates

      - name: Checkout .github (Contributing)
        uses: actions/checkout@v4
        with:
          repository: Cratis/.github
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: .github

      - name: Checkout Architecture
        uses: actions/checkout@v4
        with:
          repository: Cratis/Architecture
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Architecture

      - name: Checkout Screenplay
        uses: actions/checkout@v4
        with:
          repository: Cratis/Screenplay
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Screenplay

      - name: Checkout Stage
        uses: actions/checkout@v4
        with:
          repository: Cratis/Stage
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Stage

      - name: Checkout Screenplay.Generation
        uses: actions/checkout@v4
        with:
          repository: Cratis/Screenplay.Generation
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false
          # Full commit history without file contents, so `git log -- <file>` can date synced pages.
          fetch-depth: 0
          filter: blob:none
          path: Screenplay.Generation

      - name: Checkout Screenplay.CritterStack
        uses: actions/checkout@v4
        with:
          repository: Cratis/Screenplay.CritterStack
          ref: main
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
