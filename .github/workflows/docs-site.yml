          filter: blob:none
          path: Arc.Go

      - name: Checkout cli
        uses: actions/checkout@v4
        with:
          repository: Cratis/cli
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
