          filter: blob:none
          path: Chronicle.Mcp

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Cratis/Arc
          ref: ${{ env.DOCS_REF }}
          token: ${{ github.event_name == 'pull_request' && github.token || secrets.DOCS_CHECKOUT_TOKEN || github.token }}
