name: Documentation site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [build-docs]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Documentation
        uses: actions/checkout@v4
        with:
          path: Documentation
          persist-credentials: false

      - name: Resolve reviewed product revisions
        id: revisions
        working-directory: Documentation/web
        env:
          VALIDATE_REVIEWED_REVISIONS: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$VALIDATE_REVIEWED_REVISIONS" != "true" ]; then
            {
              for name in chronicle arc components cli; do echo "$name=main"; done
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolve() {
            jq -er --arg repository "$1" \
              '[.routes[].source | select(.repository == $repository) | .revision] | unique | if length == 1 then .[0] else error("expected one revision") end' \
              public-surface.json
          }

          {
            echo "chronicle=$(resolve Chronicle)"
            echo "arc=$(resolve Arc)"
            echo "components=$(resolve Components)"
            echo "cli=$(resolve cli)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Chronicle
        uses: actions/checkout@v4
        with:
          repository: Cratis/Chronicle
          ref: ${{ steps.revisions.outputs.chronicle }}
          path: Chronicle
          persist-credentials: false

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Cratis/Arc
          ref: ${{ steps.revisions.outputs.arc }}
          path: Arc
          persist-credentials: false

      - name: Checkout Components
        uses: actions/checkout@v4
        with:
          repository: Cratis/Components
          ref: ${{ steps.revisions.outputs.components }}
          path: Components
          persist-credentials: false

      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          repository: Cratis/cli
          ref: ${{ steps.revisions.outputs.cli }}
          path: cli
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Install dependencies
        working-directory: Documentation/web
        run: npm ci

      - name: Validate and build the exact public surface
        working-directory: Documentation/web
        run: npm run check

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/web/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
